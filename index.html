<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake Water Gun Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🐍 Snake Water Gun</h1>

    <div class="buttons">
      <button onclick="play('s')">🐍 Snake</button>
      <button onclick="play('w')">💧 Water</button>
      <button onclick="play('g')">🔫 Gun</button>
    </div>

    <div class="result">
      <p id="userChoice"></p>
      <p id="computerChoice"></p>
      <h2 id="output"></h2>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
